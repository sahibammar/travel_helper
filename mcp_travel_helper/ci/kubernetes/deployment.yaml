# MCP Travel Helper server — Deployment
# Update image to your registry (e.g. ghcr.io/myuser/travel-helper-mcp:latest)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-helper-mcp
  labels:
    app: travel-helper-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: travel-helper-mcp
  template:
    metadata:
      labels:
        app: travel-helper-mcp
    spec:
      containers:
        - name: server
          image: travel-helper-mcp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: TRAVEL_HELPER_MCP_TRANSPORT
              value: "streamable-http"
            - name: TRAVEL_HELPER_MCP_HOST
              value: "0.0.0.0"
            - name: TRAVEL_HELPER_MCP_PORT
              value: "8000"
          # Optional: mount data from ConfigMap (replace with your ConfigMap name if using real data)
          # volumeMounts:
          #   - name: data
          #     mountPath: /app/data/travel_helper.json
          #     subPath: travel_helper.json
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
      # Optional: mount ConfigMap for data/travel_helper.json
      # volumes:
      #   - name: data
      #     configMap:
      #       name: travel-helper-mcp-data
