# Run travel_helper daily at 7 AM Germany time (6:00 UTC = 7 AM CET / 8 AM CEST).
# Generates JSON report, uploads it as an artifact, commits it to the repo, and emails HTML to ammar.sahib@yahoo.com.
# Requires repo secrets: GMAIL_APP_PASSWORD (Gmail app password for sahib.ammar@gmail.com).
name: Daily travel helper

on:
  schedule:
    # 6:00 UTC = 7 AM Berlin (CET) in winter, 8 AM Berlin (CEST) in summer
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GMAIL_USER: sahib.ammar@gmail.com
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      GEOTEMP_API_KEY: ${{ secrets.GEOTEMP_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create venv and install dependencies
        run: |
          python -m venv .venv-travel
          .venv-travel/bin/pip install --upgrade pip
          .venv-travel/bin/pip install -r requirements.txt
          .venv-travel/bin/pip install ryanair-py "mcp[cli]"

      - name: Run travel helper (flights only + JSON + email HTML)
        run: |
          .venv-travel/bin/python travel_helper.py \
            --num-cheapest-trips 1800 \
            --days-ahead 360 \
            --no-hotels \
            --json \
            --html --email ammar.sahib@yahoo.com

      - name: Upload JSON report
        uses: actions/upload-artifact@v4
        with:
          name: travel-helper-report
          path: data/travel_helper.json
          retention-days: 14

      - name: Commit and push JSON to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/travel_helper.json
          if git diff --staged --quiet; then
            echo "No changes to data/travel_helper.json"
          else
            git commit -m "Daily travel helper report [skip ci]"
            git push origin HEAD:master
          fi
