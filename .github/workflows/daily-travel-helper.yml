# Run travel_helper daily at 7 AM Germany time (6:00 UTC = 7 AM CET / 8 AM CEST).
# Generates HTML report, uploads it as an artifact, and commits it to the repo (master).
name: Daily travel helper

on:
  schedule:
    # 6:00 UTC = 7 AM Berlin (CET) in winter, 8 AM Berlin (CEST) in summer
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create venv and install dependencies
        run: |
          python -m venv .venv-travel
          .venv-travel/bin/pip install --upgrade pip
          .venv-travel/bin/pip install -r requirements.txt
          .venv-travel/bin/pip install ryanair-py "mcp[cli]"

      - name: Run travel helper (flights + hotels + HTML)
        run: |
          .venv-travel/bin/python travel_helper.py \
            --num-cheapest-flights 50 \
            --cheapest-hotels-per-flight 1 \
            --days-ahead 300 \
            --html

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: travel-helper-report
          path: travel_helper.html
          retention-days: 14

      - name: Commit and push HTML to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add travel_helper.html
          if git diff --staged --quiet; then
            echo "No changes to travel_helper.html"
          else
            git commit -m "Daily travel helper report [skip ci]"
            git push origin HEAD:master
          fi
